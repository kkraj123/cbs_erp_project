name: cbs_erp_project
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^4.0.7
  equatable: ^2.0.8
  connectivity_plus: ^7.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  get: ^4.7.3
  logger: ^2.6.0
  border_bottom_navigation_bar: ^1.0.3
  mobile_scanner: ^7.4.0
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  riverpod_lint: ^2.6.1
  custom_lint: ^0.7.0
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package


  # example:
  fonts:
    - family: Barlow
      fonts:
       - asset: assets/fonts/Barlow-BlackItalic.ttf
       - asset: assets/fonts/Barlow-ExtraBold.ttf
       - asset: assets/fonts/Barlow-ExtraLight.ttf
       - asset: assets/fonts/Barlow-Light.ttf
       - asset: assets/fonts/Barlow-Medium.ttf
       - asset: assets/fonts/Barlow-SemiBoldItalic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
